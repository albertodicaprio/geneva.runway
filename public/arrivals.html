<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arrivals · Geneva Air Traffic</title>
    <link rel="icon" href="plane_ico.ico" sizes="any">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container">
        <header class="page-header">
            <div>
                <p class="eyebrow">LSGG · GENEVA</p>
                <h1>Arrivals</h1>
            </div>
            <div class="data-status" id="dataStatus" aria-live="polite">Loading live data…</div>
        </header>

        <nav class="page-nav" aria-label="Main navigation">
            <a href="/"><span class="nav-icon" aria-hidden="true">⌖</span><span>Overview</span></a>
            <a href="/arrivals.html" aria-current="page"><span class="nav-icon" aria-hidden="true">✈</span><span>Arrivals</span></a>
            <a href="/history.html"><span class="nav-icon" aria-hidden="true">◷</span><span>History</span></a>
            <a href="/stats.html"><span class="nav-icon" aria-hidden="true">▥</span><span>Stats</span></a>
        </nav>

        <main>
            <section class="aircraft-section" aria-labelledby="arrivalsHeading">
                <div class="section-heading">
                    <div>
                        <p class="eyebrow">ARRIVALS</p>
                        <h2 id="arrivalsHeading">Confirmed for Geneva</h2>
                    </div>
                    <p class="arrival-count" id="arrivalCount">—</p>
                </div>
                <div class="aircraft-list" id="aircraftList">
                    <div class="loading">Loading arrival data…</div>
                </div>
            </section>
        </main>

        <footer>
            Position data: <a href="https://opensky-network.org/" target="_blank" rel="noreferrer">OpenSky</a>
            · Route and aircraft data: <a href="https://www.adsbdb.com/" target="_blank" rel="noreferrer">ADSBdb</a>
        </footer>
    </div>

    <script src="aircraft-card.js"></script>
    <script src="aircraft-map.js"></script>
    <script src="app.js"></script>
</body>

</html>
