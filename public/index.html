<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Geneva Airport Landing Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container">
        <header>
            <h1>✈️ Geneva Airport Landing Tracker</h1>
            <p class="subtitle">Real-time runway status and incoming flights</p>
            <p class="last-updated">Last updated: <span id="lastUpdated">--:--:--</span></p>
        </header>

        <main>
            <section class="runway-section">
                <div class="runway-card">
                    <h2>Approach Runway</h2>
                    <div class="runway-display">
                        <div class="runway-number" id="runwayNumber">--</div>
                    </div>
                    <h3>Next Plane to Land</h3>
                    <div class="next-plane" id="nextPlane">
                        <p class="no-data">Loading...</p>
                    </div>
                </div>
            </section>

            <section class="aircraft-section">
                <h2>All Incoming Aircraft</h2>
                <div class="aircraft-list" id="aircraftList">
                    <div class="loading">Loading aircraft data...</div>
                </div>
            </section>

            <section class="info-section">
                <p class="info-text">Data from <a href="https://opensky-network.org/" target="_blank">OpenSky
                        Network</a> • Updates every 10 seconds</p>
            </section>
        </main>
    </div>

    <script src="app.js"></script>
</body>

</html>
