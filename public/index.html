<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Geneva Airport Landing Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container">
        <header>
            <h1>✈️ Geneva Airport Landing Tracker</h1>
            <p class="subtitle">Real-time runway status and incoming flights</p>
            <p class="last-updated">Last updated: <span id="lastUpdated">--:--:--</span></p>
        </header>

        <main>
            <section class="runways-section">
                <h2>Runway Status</h2>
                <div class="runways-grid">
                    <div class="runway-card">
                        <h3>Runway 04L/22R</h3>
                        <div class="runway-status">
                            <div class="status-badge">Active</div>
                            <div class="incoming-count" id="runway04LCount">0 incoming</div>
                        </div>
                        <div class="aircraft-on-runway" id="runway04LAircraft">
                            <p class="no-data">--</p>
                        </div>
                    </div>

                    <div class="runway-card">
                        <h3>Runway 04R/22L</h3>
                        <div class="runway-status">
                            <div class="status-badge">Active</div>
                            <div class="incoming-count" id="runway04RCount">0 incoming</div>
                        </div>
                        <div class="aircraft-on-runway" id="runway04RAircraft">
                            <p class="no-data">--</p>
                        </div>
                    </div>
                </div>
            </section>

            <section class="aircraft-section">
                <h2>Incoming Aircraft</h2>
                <div class="aircraft-list" id="aircraftList">
                    <div class="loading">Loading aircraft data...</div>
                </div>
            </section>

            <section class="info-section">
                <p class="info-text">Data from <a href="https://opensky-network.org/" target="_blank">OpenSky
                        Network</a> • Updates every 5 seconds</p>
            </section>
        </main>
    </div>

    <script src="app.js"></script>
</body>

</html>
