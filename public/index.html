<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Geneva arrivals</title>
    <link rel="icon" href="plane_ico.ico" sizes="any">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container">
        <header class="page-header">
            <div>
                <p class="eyebrow">LSGG · GENEVA</p>
                <h1>Incoming flights</h1>
                <p class="subtitle">ADSBdb-confirmed arrivals within 80 km</p>
            </div>
            <div class="data-status" id="dataStatus" aria-live="polite">Loading live data…</div>
        </header>

        <main>
            <section class="next-section" aria-labelledby="nextArrivalHeading">
                <div class="section-heading">
                    <div>
                        <p class="eyebrow">NEXT TO LAND</p>
                        <h2 id="nextArrivalHeading">Lowest reported arrival</h2>
                    </div>
                    <p class="last-updated">Updated <span id="lastUpdated">—</span></p>
                </div>
                <div class="next-arrival" id="nextPlane">
                    <p class="loading">Loading arrival data…</p>
                </div>
            </section>

            <section class="aircraft-section" aria-labelledby="arrivalsHeading">
                <div class="section-heading">
                    <div>
                        <p class="eyebrow">ARRIVALS</p>
                        <h2 id="arrivalsHeading">Confirmed for Geneva</h2>
                    </div>
                    <p class="arrival-count" id="arrivalCount">—</p>
                </div>
                <div class="aircraft-list" id="aircraftList">
                    <div class="loading">Loading arrival data…</div>
                </div>
            </section>
        </main>

        <footer>
            Position data: <a href="https://opensky-network.org/" target="_blank" rel="noreferrer">OpenSky</a>
            · Route and aircraft data: <a href="https://www.adsbdb.com/" target="_blank" rel="noreferrer">ADSBdb</a>
        </footer>
    </div>

    <script src="app.js"></script>
</body>

</html>
