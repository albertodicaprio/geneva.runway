services:
  app:
    build: .
    env_file:
      - .env
    environment:
      HOST: 0.0.0.0
      PORT: 3000
      AIRCRAFT_CACHE_FILE: /app/data/aircraft-cache.json
    expose:
      - "3000"
    volumes:
      - aircraft_data:/app/data
    restart: unless-stopped

  caddy:
    build:
      context: .
      dockerfile: Caddy.Dockerfile
    depends_on:
      - app
    environment:
      CADDY_SITE_ADDRESS: ${CADDY_SITE_ADDRESS:-https://gva-runway.duckdns.org, https://gva-runway.ahpc.ch}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped

volumes:
  aircraft_data:
  caddy_data:
  caddy_config:
