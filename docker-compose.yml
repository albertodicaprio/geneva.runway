services:
  app:
    build: .
    env_file:
      - .env
    environment:
      HOST: 0.0.0.0
      PORT: 3000
    expose:
      - "3000"
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    depends_on:
      - app
    environment:
      CADDY_SITE_ADDRESS: ${CADDY_SITE_ADDRESS:-https://gva-runway.duckdns.org}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
